<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="665" viewBox="0 0 1200 665"><rect x="0" y="0" width="1200" height="665" fill="#f7f9fc"/><text x="64" y="82" font-family="DejaVu Sans, sans-serif" font-size="33" font-weight="700" fill="#1d2939" text-anchor="start">От выполненной работы — к реальной ценности</text><rect x="48" y="180" rx="22" width="350" height="270" fill="#eef2f7" stroke="#d8e2eb" stroke-width="2"/><rect x="70" y="205" rx="7" width="110" height="34" fill="#42618b"/><text x="125" y="229" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">ACTIVITY</text><text x="73" y="290" font-family="DejaVu Sans, sans-serif" font-size="33" font-weight="700" fill="#1d2939" text-anchor="start">Действие</text><text x="73" y="348" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#1d2939" text-anchor="start">Прочитать 100 обращений</text><text x="73" y="398" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#42618b" text-anchor="start">Работа выполнена</text><line x1="401" y1="305" x2="431" y2="305" stroke="#8798a8" stroke-width="4"/><path d="M 431 305 l -11 -8 v 16 z" fill="#8798a8"/><rect x="438" y="180" rx="22" width="350" height="270" fill="#eff5fb" stroke="#d8e2eb" stroke-width="2"/><rect x="460" y="205" rx="7" width="110" height="34" fill="#2368a9"/><text x="515" y="229" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">OUTPUT</text><text x="463" y="290" font-family="DejaVu Sans, sans-serif" font-size="33" font-weight="700" fill="#1d2939" text-anchor="start">Артефакт</text><text x="463" y="348" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#1d2939" text-anchor="start">Составить отчёт</text><text x="463" y="398" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#2368a9" text-anchor="start">Документ получен</text><line x1="791" y1="305" x2="821" y2="305" stroke="#8798a8" stroke-width="4"/><path d="M 821 305 l -11 -8 v 16 z" fill="#8798a8"/><rect x="828" y="180" rx="22" width="350" height="270" fill="#eef9f5" stroke="#d8e2eb" stroke-width="2"/><rect x="850" y="205" rx="7" width="110" height="34" fill="#138067"/><text x="905" y="229" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">OUTCOME</text><text x="853" y="290" font-family="DejaVu Sans, sans-serif" font-size="33" font-weight="700" fill="#1d2939" text-anchor="start">Изменение</text><text x="853" y="348" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#1d2939" text-anchor="start">Клиенту стало проще</text><text x="853" y="398" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#138067" text-anchor="start">Эффект подтверждён</text><rect x="48" y="500" width="1104" height="100" rx="16" fill="white" stroke="#e0e7ef"/><text x="74" y="547" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#1d2939" text-anchor="start">Ключевой вопрос:</text><text x="365" y="547" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#1d2939" text-anchor="start">Что изменилось для покупателя — и как это проверить?</text><text x="74" y="576" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#667085" text-anchor="start">Отчёт и выпуск новой функции не доказывают улучшения клиентского опыта.</text></svg>