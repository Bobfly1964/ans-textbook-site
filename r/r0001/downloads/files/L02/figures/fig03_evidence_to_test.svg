<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="640" version="1.1" viewBox="0 0 1400 640" width="1400" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#ffffff" height="640" width="1400" x="0" y="0" /><text fill="#213149" font-family="DejaVu Sans" font-size="34" font-weight="bold" x="64" y="68">От свидетельства к проверке</text><text fill="#5e7084" font-family="DejaVu Sans" font-size="20" x="64" y="104">Каждый вывод должен иметь источник и потенциальное опровержение</text><rect fill="#eaf2ff" height="275" rx="16" ry="16" stroke="#dfe7f0" stroke-width="2" width="306" x="48" y="208" /><text fill="#3468af" font-family="DejaVu Sans" font-size="21" font-weight="bold" text-anchor="middle" x="201" y="270">01. ИСТОЧНИК</text><text fill="#213149" font-family="DejaVu Sans" font-size="22" font-weight="normal" text-anchor="middle" x="201" y="356">ID записи, дата,</text><text fill="#213149" font-family="DejaVu Sans" font-size="22" font-weight="normal" text-anchor="middle" x="201" y="394">буквальный фрагмент</text><line stroke="#3468af" stroke-width="4" x1="361" x2="386" y1="348" y2="348" /><polygon fill="#3468af" points="386,348 371.0,355.0 371.0,341.0" /><rect fill="#eff9f6" height="275" rx="16" ry="16" stroke="#dfe7f0" stroke-width="2" width="306" x="393" y="208" /><text fill="#157c81" font-family="DejaVu Sans" font-size="21" font-weight="bold" text-anchor="middle" x="546" y="270">02. ИНТЕРПРЕТАЦИЯ</text><text fill="#213149" font-family="DejaVu Sans" font-size="22" font-weight="normal" text-anchor="middle" x="546" y="356">Что следует из</text><text fill="#213149" font-family="DejaVu Sans" font-size="22" font-weight="normal" text-anchor="middle" x="546" y="394">записанного?</text><line stroke="#157c81" stroke-width="4" x1="706" x2="731" y1="348" y2="348" /><polygon fill="#157c81" points="731,348 716.0,355.0 716.0,341.0" /><rect fill="#fff7e9" height="275" rx="16" ry="16" stroke="#dfe7f0" stroke-width="2" width="306" x="738" y="208" /><text fill="#a86e25" font-family="DejaVu Sans" font-size="21" font-weight="bold" text-anchor="middle" x="891" y="270">03. СОМНЕНИЕ</text><text fill="#213149" font-family="DejaVu Sans" font-size="22" font-weight="normal" text-anchor="middle" x="891" y="356">Какие другие</text><text fill="#213149" font-family="DejaVu Sans" font-size="22" font-weight="normal" text-anchor="middle" x="891" y="394">объяснения возможны?</text><line stroke="#a86e25" stroke-width="4" x1="1051" x2="1076" y1="348" y2="348" /><polygon fill="#a86e25" points="1076,348 1061.0,355.0 1061.0,341.0" /><rect fill="#eff3fa" height="275" rx="16" ry="16" stroke="#dfe7f0" stroke-width="2" width="306" x="1083" y="208" /><text fill="#3468af" font-family="DejaVu Sans" font-size="21" font-weight="bold" text-anchor="middle" x="1236" y="270">04. ТЕСТ</text><text fill="#213149" font-family="DejaVu Sans" font-size="22" font-weight="normal" text-anchor="middle" x="1236" y="356">Что проверить</text><text fill="#213149" font-family="DejaVu Sans" font-size="22" font-weight="normal" text-anchor="middle" x="1236" y="394">в реальном мире?</text><text fill="#5e7084" font-family="DejaVu Sans" font-size="19" font-weight="normal" text-anchor="middle" x="700" y="575">Учебные заметки помогают тренироваться. Реальный спрос требует реальных людей.</text></svg>