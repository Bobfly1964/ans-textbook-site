<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="640" version="1.1" viewBox="0 0 1400 640" width="1400" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#ffffff" height="640" width="1400" x="0" y="0" /><text fill="#213149" font-family="DejaVu Sans" font-size="34" font-weight="bold" x="64" y="68">Как записать клиентскую задачу (JTBD)</text><text fill="#5e7084" font-family="DejaVu Sans" font-size="20" x="64" y="104">Начните не с функции будущего сервиса, а с ситуации человека</text><rect fill="#f3f7fc" height="290" rx="16" ry="16" stroke="#dfe7f0" stroke-width="2" width="243" x="53" y="196" /><text fill="#3468af" font-family="DejaVu Sans" font-size="22" font-weight="bold" text-anchor="middle" x="174.5" y="243">ТРИГГЕР</text><text fill="#5e7084" font-family="DejaVu Sans" font-size="19" font-weight="normal" text-anchor="middle" x="174.5" y="317">Когда произошло?</text><text fill="#213149" font-family="DejaVu Sans" font-size="20" font-weight="normal" text-anchor="middle" x="174.5" y="394">Изменился заказ</text><line stroke="#157c81" stroke-width="4" x1="300" x2="306" y1="340" y2="340" /><polygon fill="#157c81" points="306,340 291.0,347.0 291.0,333.0" /><rect fill="#f2faf8" height="290" rx="16" ry="16" stroke="#dfe7f0" stroke-width="2" width="243" x="320" y="196" /><text fill="#157c81" font-family="DejaVu Sans" font-size="22" font-weight="bold" text-anchor="middle" x="441.5" y="243">КОНТЕКСТ</text><text fill="#5e7084" font-family="DejaVu Sans" font-size="19" font-weight="normal" text-anchor="middle" x="441.5" y="317">При каких условиях?</text><text fill="#213149" font-family="DejaVu Sans" font-size="20" font-weight="normal" text-anchor="middle" x="441.5" y="394">Счёт уже выставлен</text><line stroke="#157c81" stroke-width="4" x1="567" x2="573" y1="340" y2="340" /><polygon fill="#157c81" points="573,340 558.0,347.0 558.0,333.0" /><rect fill="#f3f7fc" height="290" rx="16" ry="16" stroke="#dfe7f0" stroke-width="2" width="243" x="587" y="196" /><text fill="#3468af" font-family="DejaVu Sans" font-size="22" font-weight="bold" text-anchor="middle" x="708.5" y="243">ДЕЙСТВИЕ</text><text fill="#5e7084" font-family="DejaVu Sans" font-size="19" font-weight="normal" text-anchor="middle" x="708.5" y="317">Чего хочет человек?</text><text fill="#213149" font-family="DejaVu Sans" font-size="20" font-weight="normal" text-anchor="middle" x="708.5" y="394">Исправить состав</text><line stroke="#157c81" stroke-width="4" x1="834" x2="840" y1="340" y2="340" /><polygon fill="#157c81" points="840,340 825.0,347.0 825.0,333.0" /><rect fill="#f2faf8" height="290" rx="16" ry="16" stroke="#dfe7f0" stroke-width="2" width="243" x="854" y="196" /><text fill="#157c81" font-family="DejaVu Sans" font-size="22" font-weight="bold" text-anchor="middle" x="975.5" y="243">РЕЗУЛЬТАТ</text><text fill="#5e7084" font-family="DejaVu Sans" font-size="19" font-weight="normal" text-anchor="middle" x="975.5" y="317">Зачем это нужно?</text><text fill="#213149" font-family="DejaVu Sans" font-size="20" font-weight="normal" text-anchor="middle" x="975.5" y="394">Получить верный счёт</text><line stroke="#157c81" stroke-width="4" x1="1101" x2="1107" y1="340" y2="340" /><polygon fill="#157c81" points="1107,340 1092.0,347.0 1092.0,333.0" /><rect fill="#f3f7fc" height="290" rx="16" ry="16" stroke="#dfe7f0" stroke-width="2" width="243" x="1121" y="196" /><text fill="#3468af" font-family="DejaVu Sans" font-size="22" font-weight="bold" text-anchor="middle" x="1242.5" y="243">ОГРАНИЧЕНИЕ</text><text fill="#5e7084" font-family="DejaVu Sans" font-size="19" font-weight="normal" text-anchor="middle" x="1242.5" y="317">Что мешает?</text><text fill="#213149" font-family="DejaVu Sans" font-size="20" font-weight="normal" text-anchor="middle" x="1242.5" y="394">Разные версии файла</text><text fill="#5e7084" font-family="DejaVu Sans" font-size="20" font-weight="normal" text-anchor="middle" x="700" y="567">Неизвестный элемент оставьте неизвестным: не поручайте ИИ его придумывать.</text></svg>