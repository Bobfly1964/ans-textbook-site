<svg baseProfile="full" height="640" version="1.1" viewBox="0 0 1400 640" width="1400" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#ffffff" height="640" width="1400" x="0" y="0" /><text fill="#213149" font-family="DejaVu Sans" font-size="34" font-weight="bold" x="64" y="68">С чего начинать разработку стартапа</text><text fill="#5e7084" font-family="DejaVu Sans" font-size="20" x="64" y="104">Две последовательности действий ведут к разным рискам</text><rect fill="#fff8f3" height="410" rx="18" ry="18" stroke="#f5d8b4" stroke-width="2" width="610" x="60" y="155" /><rect fill="#f1faf9" height="410" rx="18" ry="18" stroke="#ccebe9" stroke-width="2" width="610" x="730" y="155" /><text fill="#a86e25" font-family="DejaVu Sans" font-size="28" font-weight="bold" text-anchor="middle" x="365" y="203">Сначала технология</text><text fill="#157c81" font-family="DejaVu Sans" font-size="28" font-weight="bold" text-anchor="middle" x="1035" y="203">Сначала клиентская задача</text><rect fill="#ffffff" height="56" rx="10" ry="10" stroke="#e1e8f0" stroke-width="2" width="480" x="125" y="234" /><text fill="#213149" font-family="DejaVu Sans" font-size="21" font-weight="normal" text-anchor="middle" x="365" y="269">Идея ИИ-сервиса</text><line stroke="#a86e25" stroke-width="4" x1="365" x2="365" y1="291" y2="309" /><polygon fill="#a86e25" points="365,309 358.0,294.0 372.0,294.0" /><rect fill="#ffffff" height="56" rx="10" ry="10" stroke="#e1e8f0" stroke-width="2" width="480" x="125" y="311" /><text fill="#213149" font-family="DejaVu Sans" font-size="21" font-weight="normal" text-anchor="middle" x="365" y="346">Разработка функций</text><line stroke="#a86e25" stroke-width="4" x1="365" x2="365" y1="368" y2="386" /><polygon fill="#a86e25" points="365,386 358.0,371.0 372.0,371.0" /><rect fill="#ffffff" height="56" rx="10" ry="10" stroke="#e1e8f0" stroke-width="2" width="480" x="125" y="388" /><text fill