<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1460" height="590" viewBox="0 0 1460 590"><rect width="1460" height="590" fill="#F5F8FC"/><text x="72" y="72" fill="#182A3F" font-size="36" font-weight="700" font-family="DejaVu Sans" text-anchor="start">От одобрения к проверяемому действию</text><text x="73" y="116" fill="#5E7389" font-size="22" font-weight="400" font-family="DejaVu Sans" text-anchor="start">Сила сигнала растет, но он должен быть реальным и подтвержденным</text><rect x="55" y="164" width="296" height="268" rx="20" fill="#EDF4FB" stroke="#C9D9E8" stroke-width="2"/><rect x="75" y="185" width="50" height="50" rx="14" fill="#2378B5" stroke="#2378B5" stroke-width="0"/><text x="100" y="219" fill="#FFFFFF" font-size="27" font-weight="700" font-family="DejaVu Sans" text-anchor="middle">1</text><text x="77" y="282" fill="#182A3F" font-size="27" font-weight="700" font-family="DejaVu Sans" text-anchor="start">Комплимент</text><text x="77" y="331" fill="#5E7389" font-size="20" font-weight="400" font-family="DejaVu Sans" text-anchor="start">«Интересная идея!»</text><text x="77" y="367" fill="#5E7389" font-size="20" font-weight="400" font-family="DejaVu Sans" text-anchor="start">Нет вложенных ресурсов</text><line x1="359" y1="301" x2="399" y2="301" stroke="#2378B5" stroke-width="4" stroke-linecap="round" /><path d="M 385 292 L 399 301 L 385 310" fill="none" stroke="#2378B5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="409" y="164" width="296" height="268" rx="20" fill="#ECF6F3" stroke="#C9D9E8" stroke-width="2"/><rect x="429" y="185" width="50" height="50" rx="14" fill="#187F78" stroke="#187F78" stroke-width="0"/><text x="454" y="219" fill="#FFFFFF" font-size="27" font-weight="700" font-family="DejaVu Sans" text-anchor="middle">2</text><text x="431" y="282" fill="#182A3F" font-size="27" font-weight="700" font-family="DejaVu Sans" text-anchor="start">Встреча</text><text x="431" y="331" fill="#5E7389" font-size="20" font-weight="400" font-family="DejaVu Sans" text-anchor="start">Согласованы время</text><text x="431" y="367" fill="#5E7389" font-size="20" font-weight="400" font-family="DejaVu Sans" text-anchor="start">и ответственный</text><line x1="713" y1="301" x2="753" y2="301" stroke="#2378B5" stroke-width="4" stroke-linecap="round" /><path d="M 739 292 L 753 301 L 739 310" fill="none" stroke="#2378B5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="763" y="164" width="296" height="268" rx="20" fill="#FFF6E7" stroke="#C9D9E8" stroke-width="2"/><rect x="783" y="185" width="50" height="50" rx="14" fill="#B4741D" stroke="#B4741D" stroke-width="0"/><text x="808" y="219" fill="#FFFFFF" font-size="27" font-weight="700" font-family="DejaVu Sans" text-anchor="middle">3</text><text x="785" y="282" fill="#182A3F" font-size="27" font-weight="700" font-family="DejaVu Sans" text-anchor="start">Пилот</text><text x="785" y="331" fill="#5E7389" font-size="20" font-weight="400" font-family="DejaVu Sans" text-anchor="start">Рамки, данные,</text><text x="785" y="367" fill="#5E7389" font-size="20" font-weight="400" font-family="DejaVu Sans" text-anchor="start">условия и приемка</text><line x1="1067" y1="301" x2="1107" y2="301" stroke="#2378B5" stroke-width="4" stroke-linecap="round" /><path d="M 1093 292 L 1107 301 L 1093 310" fill="none" stroke="#2378B5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="1117" y="164" width="296" height="268" rx="20" fill="#EEF1FC" stroke="#C9D9E8" stroke-width="2"/><rect x="1137" y="185" width="50" height="50" rx="14" fill="#5764A6" stroke="#5764A6" stroke-width="0"/><text x="1162" y="219" fill="#FFFFFF" font-size="27" font-weight="700" font-family="DejaVu Sans" text-anchor="middle">4</text><text x="1139" y="282" fill="#182A3F" font-size="27" font-weight="700" font-family="DejaVu Sans" text-anchor="start">Оплата</text><text x="1139" y="331" fill="#5E7389" font-size="20" font-weight="400" font-family="DejaVu Sans" text-anchor="start">Проверяемый платеж</text><text x="1139" y="367" fill="#5E7389" font-size="20" font-weight="400" font-family="DejaVu Sans" text-anchor="start">и полезный результат</text><rect x="55" y="466" width="1354" height="88" rx="16" fill="#E7EEF5" stroke="#E7EEF5" stroke-width="0"/><text x="86" y="506" fill="#182A3F" font-size="24" font-weight="700" font-family="DejaVu Sans" text-anchor="start">Учебные карточки S01–S12 вымышлены.</text><text x="86" y="540" fill="#5E7389" font-size="20" font-weight="400" font-family="DejaVu Sans" text-anchor="start">Из них нельзя рассчитывать реальные продажи или размеры рынка.</text></svg>