<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1460" height="704" viewBox="0 0 1460 704"><rect width="1460" height="704" fill="#F5F8FC"/><text x="72" y="73" fill="#182A3F" font-size="36" font-weight="700" font-family="DejaVu Sans" text-anchor="start">Минимальный пилот без SaaS</text><text x="72" y="118" fill="#5E7389" font-size="22" font-weight="400" font-family="DejaVu Sans" text-anchor="start">20 учебных обращений → проверяемые выводы → решение о следующем тесте</text><rect x="50" y="175" width="315" height="175" rx="20" fill="#EEF5FA" stroke="#C9D9E8" stroke-width="2"/><text x="68" y="212" fill="#2378B5" font-size="21" font-weight="700" font-family="DejaVu Sans" text-anchor="start">01</text><text x="68" y="255" fill="#182A3F" font-size="22" font-weight="700" font-family="DejaVu Sans" text-anchor="start">Согласовать границы</text><text x="68" y="293" fill="#187F78" font-size="18" font-weight="700" font-family="DejaVu Sans" text-anchor="start">Человек</text><text x="68" y="323" fill="#5E7389" font-size="17" font-weight="400" font-family="DejaVu Sans" text-anchor="start">Данные, срок, права</text><line x1="372" y1="262" x2="396" y2="262" stroke="#2378B5" stroke-width="4" stroke-linecap="round" /><path d="M 382 253 L 396 262 L 382 271" fill="none" stroke="#2378B5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="398" y="175" width="315" height="175" rx="20" fill="#EEF5FA" stroke="#C9D9E8" stroke-width="2"/><text x="416" y="212" fill="#2378B5" font-size="21" font-weight="700" font-family="DejaVu Sans" text-anchor="start">02</text><text x="416" y="255" fill="#182A3F" font-size="22" font-weight="700" font-family="DejaVu Sans" text-anchor="start">Получить данные</text><text x="416" y="293" fill="#187F78" font-size="18" font-weight="700" font-family="DejaVu Sans" text-anchor="start">Человек / импорт</text><text x="416" y="323" fill="#5E7389" font-size="17" font-weight="400" font-family="DejaVu Sans" text-anchor="start">Только допустимый CSV</text><line x1="720" y1="262" x2="744" y2="262" stroke="#2378B5" stroke-width="4" stroke-linecap="round" /><path d="M 730 253 L 744 262 L 730 271" fill="none" stroke="#2378B5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="746" y="175" width="315" height="175" rx="20" fill="#EEF5FA" stroke="#C9D9E8" stroke-width="2"/><text x="764" y="212" fill="#2378B5" font-size="21" font-weight="700" font-family="DejaVu Sans" text-anchor="start">03</text><text x="764" y="255" fill="#182A3F" font-size="22" font-weight="700" font-family="DejaVu Sans" text-anchor="start">Разметить</text><text x="764" y="293" fill="#187F78" font-size="18" font-weight="700" font-family="DejaVu Sans" text-anchor="start">ИИ + человек</text><text x="764" y="323" fill="#5E7389" font-size="17" font-weight="400" font-family="DejaVu Sans" text-anchor="start">Категории с ID</text><line x1="1068" y1="262" x2="1092" y2="262" stroke="#2378B5" stroke-width="4" stroke-linecap="round" /><path d="M 1078 253 L 1092 262 L 1078 271" fill="none" stroke="#2378B5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="1094" y="175" width="315" height="175" rx="20" fill="#EEF5FA" stroke="#C9D9E8" stroke-width="2"/><text x="1112" y="212" fill="#2378B5" font-size="21" font-weight="700" font-family="DejaVu Sans" text-anchor="start">04</text><text x="1112" y="255" fill="#182A3F" font-size="22" font-weight="700" font-family="DejaVu Sans" text-anchor="start">Перепроверить</text><text x="1112" y="293" fill="#187F78" font-size="18" font-weight="700" font-family="DejaVu Sans" text-anchor="start">Человек</text><text x="1112" y="323" fill="#5E7389" font-size="17" font-weight="400" font-family="DejaVu Sans" text-anchor="start">Цитаты и подсчеты</text><line x1="1251.5" y1="359" x2="1251.5" y2="401" stroke="#2378B5" stroke-width="4" stroke-linecap="round" /><path d="M 1242.5 387 L 1251.5 401 L 1260.5 387" fill="none" stroke="#2378B5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="746" y="415" width="315" height="175" rx="20" fill="#F0F8F5" stroke="#C9D9E8" stroke-width="2"/><text x="764" y="452" fill="#2378B5" font-size="21" font-weight="700" font-family="DejaVu Sans" text-anchor="start">05</text><text x="764" y="495" fill="#182A3F" font-size="22" font-weight="700" font-family="DejaVu Sans" text-anchor="start">Сделать выводы</text><text x="764" y="533" fill="#187F78" font-size="18" font-weight="700" font-family="DejaVu Sans" text-anchor="start">Человек + ИИ</text><text x="764" y="563" fill="#5E7389" font-size="17" font-weight="400" font-family="DejaVu Sans" text-anchor="start">Не путать гипотезы с фактами</text><line x1="713" y1="502" x2="741" y2="502" stroke="#2378B5" stroke-width="4" stroke-linecap="round" /><path d="M 729 492 L 713 502 L 729 512" fill="none" stroke="#2378B5" stroke-width="4" /><rect x="398" y="415" width="315" height="175" rx="20" fill="#F0F8F5" stroke="#C9D9E8" stroke-width="2"/><text x="416" y="452" fill="#2378B5" font-size="21" font-weight="700" font-family="DejaVu Sans" text-anchor="start">06</text><text x="416" y="495" fill="#182A3F" font-size="22" font-weight="700" font-family="DejaVu Sans" text-anchor="start">Передать результат</text><text x="416" y="533" fill="#187F78" font-size="18" font-weight="700" font-family="DejaVu Sans" text-anchor="start">Человек</text><text x="416" y="563" fill="#5E7389" font-size="17" font-weight="400" font-family="DejaVu Sans" text-anchor="start">Отчет и 2 действия</text><line x1="365" y1="502" x2="393" y2="502" stroke="#2378B5" stroke-width="4" stroke-linecap="round" /><path d="M 381 492 L 365 502 L 381 512" fill="none" stroke="#2378B5" stroke-width="4" /><rect x="50" y="415" width="315" height="175" rx="20" fill="#F0F8F5" stroke="#C9D9E8" stroke-width="2"/><text x="68" y="452" fill="#2378B5" font-size="21" font-weight="700" font-family="DejaVu Sans" text-anchor="start">07</text><text x="68" y="495" fill="#182A3F" font-size="22" font-weight="700" font-family="DejaVu Sans" text-anchor="start">Принять решение</text><text x="68" y="533" fill="#187F78" font-size="18" font-weight="700" font-family="DejaVu Sans" text-anchor="start">Покупатель + основатель</text><text x="68" y="563" fill="#5E7389" font-size="17" font-weight="400" font-family="DejaVu Sans" text-anchor="start">Продолжить / изменить / стоп</text><text x="72" y="663" fill="#A34D45" font-size="20" font-weight="700" font-family="DejaVu Sans" text-anchor="start">Если нет разрешения на реальные данные — остановка или только учебная синтетика.</text></svg>