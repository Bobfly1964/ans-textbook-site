<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1460" height="642" viewBox="0 0 1460 642"><rect width="1460" height="642" fill="#F5F8FC"/><text x="68" y="68" fill="#182A3F" font-size="36" font-weight="700" font-family="DejaVu Sans" text-anchor="start">Экономика одного учебного пилота</text><text x="68" y="112" fill="#5E7389" font-size="21" font-weight="400" font-family="DejaVu Sans" text-anchor="start">Все числа вымышлены. Время основателя включено в экономические затраты.</text><text x="76" y="182" fill="#182A3F" font-size="24" font-weight="700" font-family="DejaVu Sans" text-anchor="start">Цена-гипотеза</text><text x="364" y="182" fill="#182A3F" font-size="27" font-weight="700" font-family="DejaVu Sans" text-anchor="start">240 €</text><rect x="75" y="213" width="1310" height="64" rx="13" fill="#FFFFFF" stroke="#C9D9E8" stroke-width="2"/><rect x="84" y="222" width="662.5" height="46" fill="#3676B5" /><rect x="746.5" y="222" width="265.0" height="46" fill="#2C9185" /><rect x="1011.5" y="222" width="53.0" height="46" fill="#DCA253" /><rect x="1064.5" y="222" width="79.5" height="46" fill="#8D9CB0" /><rect x="1144.0" y="222" width="212.0" height="46" fill="#F8E1AF" /><rect x="87" y="316" width="22" height="22" rx="4" fill="#3676B5"/><text x="121" y="335" fill="#182A3F" font-size="21" font-weight="700" font-family="DejaVu Sans" text-anchor="start">Работа и проверка</text><text x="397" y="335" fill="#5E7389" font-size="21" font-weight="400" font-family="DejaVu Sans" text-anchor="start">125 €</text><rect x="517" y="316" width="22" height="22" rx="4" fill="#2C9185"/><text x="551" y="335" fill="#182A3F" font-size="21" font-weight="700" font-family="DejaVu Sans" text-anchor="start">Согласование</text><text x="827" y="335" fill="#5E7389" font-size="21" font-weight="400" font-family="DejaVu Sans" text-anchor="start">50 €</text><rect x="947" y="316" width="22" height="22" rx="4" fill="#DCA253"/><text x="981" y="335" fill="#182A3F" font-size="21" font-weight="700" font-family="DejaVu Sans" text-anchor="start">ИИ</text><text x="1257" y="335" fill="#5E7389" font-size="21" font-weight="400" font-family="DejaVu Sans" text-anchor="start">10 €</text><rect x="87" y="388" width="22" height="22" rx="4" fill="#8D9CB0"/><text x="121" y="407" fill="#182A3F" font-size="21" font-weight="700" font-family="DejaVu Sans" text-anchor="start">Прочее</text><text x="397" y="407" fill="#5E7389" font-size="21" font-weight="400" font-family="DejaVu Sans" text-anchor="start">15 €</text><rect x="517" y="388" width="22" height="22" rx="4" fill="#F8E1AF"/><text x="551" y="407" fill="#182A3F" font-size="21" font-weight="700" font-family="DejaVu Sans" text-anchor="start">Остаток</text><text x="827" y="407" fill="#5E7389" font-size="21" font-weight="400" font-family="DejaVu Sans" text-anchor="start">40 €</text><rect x="77" y="513" width="1307" height="92" rx="15" fill="#F8EAE6" stroke="#F8EAE6" stroke-width="0"/><text x="104" y="548" fill="#A34D45" font-size="24" font-weight="700" font-family="DejaVu Sans" text-anchor="start">При еще пяти часах проверки: затраты 325 €, разность −85 €.</text><text x="104" y="585" fill="#5E7389" font-size="19" font-weight="400" font-family="DejaVu Sans" text-anchor="start">Это не «чистая прибыль» и не доказанный тариф реального рынка.</text></svg>