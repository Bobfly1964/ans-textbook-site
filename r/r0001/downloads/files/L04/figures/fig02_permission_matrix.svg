<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1500" height="770" viewBox="0 0 1500 770"><rect width="1500" height="770" fill="#F5F8FC"/><text x="75" y="75" fill="#182A3F" font-size="38" font-weight="700" font-family="DejaVu Sans" text-anchor="start">Полномочия: сначала ограничьте действие технически</text><text x="75" y="120" fill="#5E7389" font-size="22" font-weight="400" font-family="DejaVu Sans" text-anchor="start">Четыре класса работы и один принцип: ненужный инструмент не следует подключать</text><rect x="60" y="205" width="340" height="280" rx="18" fill="#F0F8F5" stroke="#C9D9E8" stroke-width="2"/><text x="230" y="258" fill="#182A3F" font-size="34" font-weight="700" font-family="DejaVu Sans" text-anchor="middle">READ</text><text x="230" y="306" fill="#187F78" font-size="20" font-weight="700" font-family="DejaVu Sans" text-anchor="middle">РАЗРЕШЕНО</text><text x="230" y="365" fill="#5E7389" font-size="20" font-weight="400" font-family="DejaVu Sans" text-anchor="middle">Читать 20 строк</text><text x="230" y="397" fill="#5E7389" font-size="20" font-weight="400" font-family="DejaVu Sans" text-anchor="middle">из учебного CSV</text><rect x="425" y="205" width="340" height="280" rx="18" fill="#F0F8F5" stroke="#C9D9E8" stroke-width="2"/><text x="595" y="258" fill="#182A3F" font-size="34" font-weight="700" font-family="DejaVu Sans" text-anchor="middle">DRAFT</text><text x="595" y="306" fill="#187F78" font-size="20" font-weight="700" font-family="DejaVu Sans" text-anchor="middle">РАЗРЕШЕНО</text><text x="595" y="365" fill="#5E7389" font-size="20" font-weight="400" font-family="DejaVu Sans" text-anchor="middle">Предложить текст</text><text x="595" y="397" fill="#5E7389" font-size="20" font-weight="400" font-family="DejaVu Sans" text-anchor="middle">для проверки</text><rect x="790" y="205" width="340" height="280" rx="18" fill="#FFF2EF" stroke="#C9D9E8" stroke-width="2"/><text x="960" y="258" fill="#182A3F" font-size="34" font-weight="700" font-family="DejaVu Sans" text-anchor="middle">EDIT</text><text x="960" y="306" fill="#A34D45" font-size="20" font-weight="700" font-family="DejaVu Sans" text-anchor="middle">ЗАПРЕЩЕНО</text><text x="960" y="365" fill="#5E7389" font-size="20" font-weight="400" font-family="DejaVu Sans" text-anchor="middle">Менять исходные</text><text x="960" y="397" fill="#5E7389" font-size="20" font-weight="400" font-family="DejaVu Sans" text-anchor="middle">файлы и данные</text><rect x="1155" y="205" width="340" height="280" rx="18" fill="#FFF2EF" stroke="#C9D9E8" stroke-width="2"/><text x="1325" y="258" fill="#182A3F" font-size="34" font-weight="700" font-family="DejaVu Sans" text-anchor="middle">EXTERNAL</text><text x="1325" y="306" fill="#A34D45" font-size="20" font-weight="700" font-family="DejaVu Sans" text-anchor="middle">ЗАПРЕЩЕНО</text><text x="1325" y="365" fill="#5E7389" font-size="20" font-weight="400" font-family="DejaVu Sans" text-anchor="middle">Писать клиентам,</text><text x="1325" y="397" fill="#5E7389" font-size="20" font-weight="400" font-family="DejaVu Sans" text-anchor="middle">CRM, платежи</text><rect x="90" y="550" width="1320" height="134" rx="18" fill="#FFFFFF" stroke="#AFC8DF" stroke-width="2"/><text x="120" y="601" fill="#2378B5" font-size="27" font-weight="700" font-family="DejaVu Sans" text-anchor="start">Слова в промпте ≠ реальные разрешения инструмента</text><text x="120" y="641" fill="#5E7389" font-size="18" font-weight="400" font-family="DejaVu Sans" text-anchor="start">Среда должна исключать отправку, запись и доступ к неразрешённым источникам.</text><text x="75" y="726" fill="#A34D45" font-size="18" font-weight="700" font-family="DejaVu Sans" text-anchor="start">Недоверенный текст клиента не вправе расширять полномочия агента.</text></svg>