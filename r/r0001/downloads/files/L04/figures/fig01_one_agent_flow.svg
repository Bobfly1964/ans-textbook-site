<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1500" height="770" viewBox="0 0 1500 770"><rect width="1500" height="770" fill="#F5F8FC"/><text x="75" y="75" fill="#182A3F" font-size="38" font-weight="700" font-family="DejaVu Sans" text-anchor="start">Один ИИ-исполнитель: минимальная рабочая система</text><text x="75" y="120" fill="#5E7389" font-size="22" font-weight="400" font-family="DejaVu Sans" text-anchor="start">Человек определяет цель, агент готовит черновик, проверка остаётся обязательной</text><rect x="55" y="202" width="220" height="215" rx="18" fill="#F0F8F5" stroke="#C9D9E8" stroke-width="2"/><text x="165" y="265" fill="#187F78" font-size="23" font-weight="700" font-family="DejaVu Sans" text-anchor="middle">Основатель</text><text x="165" y="315" fill="#5E7389" font-size="16" font-weight="400" font-family="DejaVu Sans" text-anchor="middle">Принимает цель</text><text x="165" y="345" fill="#5E7389" font-size="16" font-weight="400" font-family="DejaVu Sans" text-anchor="middle">и разрешения</text><path d="M 278 307 L 295 307" fill="none" stroke="#2378B5" stroke-width="4" stroke-linecap="round"/><path d="M 283 298 L 295 307 L 283 316" fill="none" stroke="#2378B5" stroke-width="4" stroke-linejoin="round"/><rect x="297" y="202" width="220" height="215" rx="18" fill="#EEF5FA" stroke="#C9D9E8" stroke-width="2"/><text x="407" y="265" fill="#2378B5" font-size="23" font-weight="700" font-family="DejaVu Sans" text-anchor="middle">Контракт</text><text x="407" y="315" fill="#5E7389" font-size="16" font-weight="400" font-family="DejaVu Sans" text-anchor="middle">Вход, ограничения,</text><text x="407" y="345" fill="#5E7389" font-size="16" font-weight="400" font-family="DejaVu Sans" text-anchor="middle">критерии DoD</text><path d="M 520 307 L 537 307" fill="none" stroke="#2378B5" stroke-width="4" stroke-linecap="round"/><path d="M 525 298 L 537 307 L 525 316" fill="none" stroke="#2378B5" stroke-width="4" stroke-linejoin="round"/><rect x="539" y="202" width="220" height="215" rx="18" fill="#EEF5FA" stroke="#C9D9E8" stroke-width="2"/><text x="649" y="265" fill="#2378B5" font-size="23" font-weight="700" font-family="DejaVu Sans" text-anchor="middle">Агент</text><text x="649" y="315" fill="#5E7389" font-size="16" font-weight="400" font-family="DejaVu Sans" text-anchor="middle">Размечает только</text><text x="649" y="345" fill="#5E7389" font-size="16" font-weight="400" font-family="DejaVu Sans" text-anchor="middle">учебный текст</text><path d="M 762 307 L 779 307" fill="none" stroke="#2378B5" stroke-width="4" stroke-linecap="round"/><path d="M 767 298 L 779 307 L 767 316" fill="none" stroke="#2378B5" stroke-width="4" stroke-linejoin="round"/><rect x="781" y="202" width="220" height="215" rx="18" fill="#EEF5FA" stroke="#C9D9E8" stroke-width="2"/><text x="891" y="265" fill="#2378B5" font-size="23" font-weight="700" font-family="DejaVu Sans" text-anchor="middle">Инструмент</text><text x="891" y="315" fill="#5E7389" font-size="16" font-weight="400" font-family="DejaVu Sans" text-anchor="middle">Читает один</text><text x="891" y="345" fill="#5E7389" font-size="16" font-weight="400" font-family="DejaVu Sans" text-anchor="middle">синтетический CSV</text><path d="M 1004 307 L 1021 307" fill="none" stroke="#2378B5" stroke-width="4" stroke-linecap="round"/><path d="M 1009 298 L 1021 307 L 1009 316" fill="none" stroke="#2378B5" stroke-width="4" stroke-linejoin="round"/><rect x="1023" y="202" width="220" height="215" rx="18" fill="#EEF5FA" stroke="#C9D9E8" stroke-width="2"/><text x="1133" y="265" fill="#2378B5" font-size="23" font-weight="700" font-family="DejaVu Sans" text-anchor="middle">Черновик</text><text x="1133" y="315" fill="#5E7389" font-size="16" font-weight="400" font-family="DejaVu Sans" text-anchor="middle">Цитаты + ID,</text><text x="1133" y="345" fill="#5E7389" font-size="16" font-weight="400" font-family="DejaVu Sans" text-anchor="middle">гипотезы</text><path d="M 1246 307 L 1263 307" fill="none" stroke="#2378B5" stroke-width="4" stroke-linecap="round"/><path d="M 1251 298 L 1263 307 L 1251 316" fill="none" stroke="#2378B5" stroke-width="4" stroke-linejoin="round"/><rect x="1265" y="202" width="220" height="215" rx="18" fill="#F0F8F5" stroke="#C9D9E8" stroke-width="2"/><text x="1375" y="265" fill="#187F78" font-size="23" font-weight="700" font-family="DejaVu Sans" text-anchor="middle">Человек</text><text x="1375" y="315" fill="#5E7389" font-size="16" font-weight="400" font-family="DejaVu Sans" text-anchor="middle">Проверяет</text><text x="1375" y="345" fill="#5E7389" font-size="16" font-weight="400" font-family="DejaVu Sans" text-anchor="middle">и утверждает</text><rect x="95" y="485" width="1310" height="165" rx="18" fill="#FFF2EF" stroke="#EAC8C2" stroke-width="2"/><text x="125" y="532" fill="#A34D45" font-size="22" font-weight="700" font-family="DejaVu Sans" text-anchor="start">НЕ ПОДКЛЮЧЕНО: реальные CRM, почта, платёжные инструменты, публикации</text><text x="125" y="575" fill="#5E7389" font-size="19" font-weight="400" font-family="DejaVu Sans" text-anchor="start">Статус источника: SYNTHETIC. Выводы о спросе и причинности — только гипотезы.</text><text x="125" y="613" fill="#5E7389" font-size="19" font-weight="400" font-family="DejaVu Sans" text-anchor="start">Одного агентного цикла недостаточно для разрешения опасных внешних действий.</text><text x="75" y="719" fill="#5E7389" font-size="18" font-weight="400" font-family="DejaVu Sans" text-anchor="start">В режиме обычного чата перенос данных и проверку выполняет оператор, а не фоновый агент.</text></svg>